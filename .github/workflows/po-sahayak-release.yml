name: PO Sahayak release (direct APK link)

# Builds the release APK whenever the app changes and publishes it as the
# pre-release po-sahayak-keep-v<pubspec version> (never marked "latest", so the
# PDF Toolkit releases are unaffected). The same version is re-uploaded in
# place; bump `version:` in pubspec.yaml for a new release. Direct link:
# https://github.com/<owner>/<repo>/releases/download/po-sahayak-keep-v1.0.0/po_sahayak.apk
# "keep" in the tag protects it from manage-releases.yml pruning.
on:
  push:
    branches: [ master, main, ccr-6e593026-40nzag ]
    paths: [ 'po_sahayak/**', '.github/workflows/po-sahayak-release.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: po_sahayak
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk po_sahayak.apk

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="po-sahayak-keep-v$VERSION"
          NOTES="PO Sahayak: offline Kannada/English calculator for Post Office savings schemes. Install: download po_sahayak.apk on your phone, open it, and allow installing from this source. Estimate only, confirm at your post office. Not affiliated with India Post."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" po_sahayak.apk --clobber
          else
            gh release create "$TAG" po_sahayak.apk --title "PO Sahayak v$VERSION" \
              --notes "$NOTES" --prerelease --latest=false --target "$GITHUB_SHA"
          fi
