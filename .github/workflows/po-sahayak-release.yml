name: PO Sahayak release (direct APK link)

# Push a tag like po-sahayak-keep-v1.0.0 to build the release APK and publish
# it as a pre-release (never marked "latest", so the PDF Toolkit releases are
# unaffected). Direct link:
# https://github.com/<owner>/<repo>/releases/download/<tag>/po_sahayak.apk
# "keep" in the tag protects it from manage-releases.yml pruning.
on:
  push:
    tags: [ 'po-sahayak-*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: po_sahayak
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk po_sahayak.apk

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="PO Sahayak: offline Kannada/English calculator for Post Office savings schemes. Install: download po_sahayak.apk on your phone, open it, and allow installing from this source. Estimate only, confirm at your post office. Not affiliated with India Post."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" po_sahayak.apk --clobber
          else
            gh release create "$TAG" po_sahayak.apk --title "PO Sahayak ${TAG#po-sahayak-keep-}" \
              --notes "$NOTES" --prerelease --latest=false --verify-tag
          fi
