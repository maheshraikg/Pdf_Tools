name: Tulu Nighantu AI server (deploy)

# Deploys tulu_nighantu/backend/ai-worker to Cloudflare Workers and stores the
# Gemini key as a Worker secret. Needs these repository secrets:
#   CLOUDFLARE_API_TOKEN   (Cloudflare token with "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
#   GEMINI_API_KEY
# Optional:
#   TULU_ADMIN_PASSWORD    password for the word-suggestion review page
#                          (https://<worker>/admin)
# The key is never written to the repository or the app.

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths: [ 'tulu_nighantu/backend/ai-worker/**', '.github/workflows/tulu-nighantu-ai-worker.yml' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tulu_nighantu/backend/ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ADMIN_PASSWORD: ${{ secrets.TULU_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test worker
        run: npm test

      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::AI server not deployed: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GEMINI_API_KEY repository secrets (see tulu_nighantu/backend/ai-worker/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Storage for word suggestions (Workers KV). Created once, then reused.
      # If the token cannot manage KV, the Worker is deployed without it and
      # the app shows "Suggestions are not set up yet".
      - name: Set up suggestion storage
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        run: |
          find_id() {
            npx --yes wrangler@4 kv namespace list 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const j = JSON.parse(s.slice(s.indexOf("[")));
                const n = j.find(n => /SUGGEST_KV$/.test(n.title));
                if (n) process.stdout.write(n.id);
              });'
          }
          ID=$(find_id || true)
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 kv namespace create SUGGEST_KV
            ID=$(find_id)
          fi
          test -n "$ID"
          printf '\n[[kv_namespaces]]\nbinding = "SUGGEST_KV"\nid = "%s"\n' "$ID" >> wrangler.toml
          echo "Suggestion storage ready."

      - name: Deploy worker
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 deploy

      - name: Store Gemini key as a Worker secret
        if: steps.check.outputs.ready == 'true'
        run: printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY

      - name: Store admin password as a Worker secret
        if: steps.check.outputs.ready == 'true' && env.ADMIN_PASSWORD != ''
        run: printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 secret put ADMIN_TOKEN
