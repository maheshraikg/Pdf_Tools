name: Tulu Nighantu release (Play Store)

# Builds the signed app bundle (.aab) for the Play Store, plus a signed APK.
#
# Repository secrets (Settings › Secrets and variables › Actions):
#   TULU_KEYSTORE_BASE64   upload keystore (.jks), base64-encoded
#   TULU_KEYSTORE_PASSWORD keystore and key password
#   TULU_KEY_ALIAS         key alias (e.g. "upload")
# Without them the build is signed with the debug key and is NOT accepted by
# the Play Store (useful only to check that a release build works).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tulu-nighantu-release.yml'
      - 'tulu_nighantu/android/app/build.gradle.kts'

jobs:
  release:
    name: Build release app bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tulu_nighantu
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Set up upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.TULU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TULU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TULU_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::warning::No upload key secrets: signing with the debug key. The Play Store will reject this build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build app bundle and APK
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}
        run: |
          flutter build appbundle --release --dart-define=AI_PROXY_URL="$AI_PROXY_URL"
          flutter build apk --release --dart-define=AI_PROXY_URL="$AI_PROXY_URL"

      - name: Remove upload key
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: tulu-nighantu-release-aab
          path: tulu_nighantu/build/app/outputs/bundle/release/app-release.aab

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tulu-nighantu-release-apk
          path: tulu_nighantu/build/app/outputs/flutter-apk/app-release.apk
