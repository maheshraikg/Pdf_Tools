name: KSPSTADK app (Flutter)

on:
  push:
    branches: [ master, main ]
    paths: [ 'kspstadk_app/**', '.github/workflows/kspstadk-app.yml' ]
  pull_request:
    paths: [ 'kspstadk_app/**', '.github/workflows/kspstadk-app.yml' ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and build release APK + AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kspstadk_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Notifier script tests
        run: python3 -m unittest discover -s tool -v

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      # Smaller per-CPU APKs for sharing outside Play (most phones: arm64-v8a).
      - name: Build split-per-ABI APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/app-release-universal.apk"
          flutter build apk --release --split-per-abi
          cp "$RUNNER_TEMP/app-release-universal.apk" build/app/outputs/flutter-apk/app-release.apk

      - name: Sizes
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          ls -l "$APK" "$AAB" build/app/outputs/flutter-apk/
          {
            echo "APK: $(du -h "$APK" | cut -f1) ($(stat -c %s "$APK") bytes)"
            echo ""
            echo "AAB: $(du -h "$AAB" | cut -f1) ($(stat -c %s "$AAB") bytes)"
            for f in build/app/outputs/flutter-apk/app-*-release.apk; do
              echo ""
              echo "$(basename "$f"): $(du -h "$f" | cut -f1) ($(stat -c %s "$f") bytes)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kspstadk-release-apk
          path: kspstadk_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: kspstadk-release-apk-arm64
          path: kspstadk_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: kspstadk-release-aab
          path: kspstadk_app/build/app/outputs/bundle/release/app-release.aab
