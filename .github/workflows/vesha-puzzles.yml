name: Vesha Puzzles (Flutter)

on:
  push:
    branches: [ master, main ]
    paths: [ 'vesha_puzzles/**', '.github/workflows/vesha-puzzles.yml' ]
  pull_request:
    paths: [ 'vesha_puzzles/**', '.github/workflows/vesha-puzzles.yml' ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vesha_puzzles
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: APK size
        run: |
          ls -l build/app/outputs/flutter-apk/app-release.apk
          echo "APK: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1) ($(stat -c %s build/app/outputs/flutter-apk/app-release.apk) bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: vesha-puzzles-release-apk
          path: vesha_puzzles/build/app/outputs/flutter-apk/app-release.apk
