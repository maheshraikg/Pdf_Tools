name: Rupio (Flutter)

on:
  push:
    branches: [ master, main ]
    paths: [ 'rupeetrack/**', '.github/workflows/rupeetrack.yml' ]
  pull_request:
    paths: [ 'rupeetrack/**', '.github/workflows/rupeetrack.yml' ]
  workflow_dispatch:

# A fixed tag gives a permanent direct link to the newest APK:
#   https://github.com/<owner>/<repo>/releases/download/rupeetrack-keep/Rupio.apk
# "keep" protects it from manage-releases.yml pruning; it is a pre-release so
# it never becomes the PDF Toolkit's "Latest" release.
env:
  APK_TAG: rupeetrack-keep

jobs:
  build:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rupeetrack
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        env:
          # Optional: turns on "Connect Gmail" (see rupeetrack/README.md).
          GMAIL_WEB_CLIENT_ID: ${{ vars.GMAIL_WEB_CLIENT_ID }}
        run: |
          # The "direct" flavor (with bank SMS) is the APK people download.
          flutter build apk --release --flavor direct --dart-define=GMAIL_WEB_CLIENT_ID="$GMAIL_WEB_CLIENT_ID"
          cp build/app/outputs/flutter-apk/app-direct-release.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Build Google Play bundle
        # Needs the private upload key as repository secrets (see
        # rupeetrack/store/PLAY_CONSOLE.md). Skipped until they are added.
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.RUPIO_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.RUPIO_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.RUPIO_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.RUPIO_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Play bundle skipped: upload key secrets are not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$UPLOAD_STORE_PASSWORD" "$UPLOAD_KEY_ALIAS" "$UPLOAD_KEY_PASSWORD" > android/key.properties
          flutter build appbundle --release --flavor play
          rm -f android/key.properties android/app/upload-keystore.jks
          echo "Play bundle: $(du -h build/app/outputs/bundle/playRelease/app-play-release.aab | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Google Play bundle
        if: hashFiles('rupeetrack/build/app/outputs/bundle/playRelease/app-play-release.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rupio-play-bundle
          path: rupeetrack/build/app/outputs/bundle/playRelease/app-play-release.aab

      - name: APK size
        run: |
          ls -l build/app/outputs/flutter-apk/app-release.apk
          echo "APK: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1) ($(stat -c %s build/app/outputs/flutter-apk/app-release.apk) bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rupeetrack-release-apk
          path: rupeetrack/build/app/outputs/flutter-apk/app-release.apk

  publish:
    name: Publish APK download link
    needs: build
    # Not for pull requests from forks (no write access there).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rupeetrack-release-apk

      - name: Upload to the rupeetrack-keep release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mv app-release.apk Rupio.apk
          if gh release view "$APK_TAG" >/dev/null 2>&1; then
            # Point the tag at the commit this APK was built from.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$APK_TAG" -f sha="$SHA" -F force=true
            gh release edit "$APK_TAG" --title "Rupio (latest build)" \
              --notes "Newest Rupio APK, rebuilt automatically. Direct link: https://github.com/$GH_REPO/releases/download/$APK_TAG/Rupio.apk"
            # The app was called RupeeTrack before; drop the old file name.
            gh release delete-asset "$APK_TAG" RupeeTrack.apk -y || true
          else
            gh release create "$APK_TAG" --target "$SHA" --prerelease --latest=false \
              --title "Rupio (latest build)" \
              --notes "Newest Rupio APK, rebuilt automatically. Direct link: https://github.com/$GH_REPO/releases/download/$APK_TAG/Rupio.apk"
          fi
          gh release upload "$APK_TAG" Rupio.apk --clobber
          echo "Direct download: https://github.com/$GH_REPO/releases/download/$APK_TAG/Rupio.apk" >> "$GITHUB_STEP_SUMMARY"
