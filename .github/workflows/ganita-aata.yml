name: Ganita Aata (Flutter)

on:
  push:
    branches: [ master, main ]
    paths: [ 'ganita_aata/**', '.github/workflows/ganita-aata.yml' ]
  pull_request:
    paths: [ 'ganita_aata/**', '.github/workflows/ganita-aata.yml' ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ganita_aata
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Check build log for warnings
        run: |
          if grep -inE '(^|[^a-z])(warning|w:|error|e:)[: ]' build.log | grep -viE 'warnings? *: *0|--warning-mode'; then
            echo "::warning::The release build printed warnings (listed above)."
            echo "### Build warnings" >> "$GITHUB_STEP_SUMMARY"
            grep -inE '(^|[^a-z])(warning|w:|error|e:)[: ]' build.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No warnings or errors in the release build." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check permissions (no INTERNET) and package name
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT" dump badging "$APK" | grep -E "^package:|uses-permission|launchable-activity|sdkVersion"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.ganitaaata.app'"
          if "$AAPT" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::Release APK requests INTERNET permission"; exit 1
          fi
          echo "APK: $(du -h $APK | cut -f1) ($(stat -c %s $APK) bytes), no INTERNET permission" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ganita-aata-release-apk
          path: ganita_aata/build/app/outputs/flutter-apk/app-release.apk
