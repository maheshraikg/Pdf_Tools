name: KSPSTADK site inspection (read-only)

# Reads the public WordPress REST API of kspstadk.com (GET only) and commits the
# responses as test fixtures plus a generated report. Never writes to the site.
on:
  push:
    paths: [ 'kspstadk_app/tool/inspect_site.py', '.github/workflows/kspstadk-site-inspect.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect site
        working-directory: kspstadk_app
        run: python3 tool/inspect_site.py | tee "$RUNNER_TEMP/report.md"
      - name: Job summary
        if: always()
        run: cat kspstadk_app/docs/site_inspection.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit fixtures and report back to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add kspstadk_app/test/fixtures kspstadk_app/docs/site_inspection.md || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "KSPSTADK app: refresh site inspection fixtures [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
