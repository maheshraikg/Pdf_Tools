name: Akshara Aata Gemini kagunita

# Speaks kagunita with Google Gemini TTS (needs the GEMINI_API_KEY secret)
# and keeps takes the IndicConformer Kannada recogniser hears exactly right.
on:
  push:
    paths:
      - '.github/workflows/akshara-aata-gemini.yml'
      - 'akshara_aata/tool/gemini_kagunita.py'
      - 'akshara_aata/tool/gemini.cfg'

permissions:
  contents: write

jobs:
  speak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    defaults:
      run:
        working-directory: akshara_aata
    steps:
      - uses: actions/checkout@v4
      - name: Settings
        id: cfg
        run: grep -v '^#' tool/gemini.cfg >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cache the recogniser
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-indic-conformer-600m
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
          printf 'torch==2.5.1\ntorchaudio==2.5.1\n' > /tmp/pins.txt
          pip install -c /tmp/pins.txt 'transformers<4.50' soundfile onnx onnxruntime
      - name: Speak and check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API_KEYP }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHARD: ${{ matrix.shard }}
          SHARDS: 1
          ONLY: ${{ steps.cfg.outputs.ONLY }}
          VOICE: ${{ steps.cfg.outputs.VOICE }}
          GH_TOKEN: ${{ github.token }}
          PROGRESS_CMD: >-
            tar czf ../gemini-${{ matrix.shard }}.tgz out &&
            gh release upload akshara-aata-voice-keep ../gemini-${{ matrix.shard }}.tgz --clobber -R ${{ github.repository }} >/dev/null 2>&1
        run: python3 tool/gemini_kagunita.py out
      - name: Upload
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          tar czf ../gemini-${{ matrix.shard }}.tgz out
          gh release upload akshara-aata-voice-keep ../gemini-${{ matrix.shard }}.tgz --clobber -R "$GITHUB_REPOSITORY"
