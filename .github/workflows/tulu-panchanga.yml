name: Tulu Panchanga (Flutter)

on:
  push:
    branches: [ master, main ]
    paths: [ 'tulu_panchanga/**', '.github/workflows/tulu-panchanga.yml' ]
  pull_request:
    paths: [ 'tulu_panchanga/**', '.github/workflows/tulu-panchanga.yml' ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tulu_panchanga
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Export Mangaluru CSVs (current and next year)
        run: |
          Y=$(date +%Y)
          for y in $Y $((Y+1)); do
            dart run tool/export_csv.dart --year $y --place mangaluru --out build/csv
          done

      - name: Build release APK
        run: flutter build apk --release

      - name: APK size
        run: |
          ls -l build/app/outputs/flutter-apk/app-release.apk
          echo "APK: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1) ($(stat -c %s build/app/outputs/flutter-apk/app-release.apk) bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tulu-panchanga-release-apk
          path: tulu_panchanga/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload CSVs
        uses: actions/upload-artifact@v4
        with:
          name: tulu-panchanga-mangaluru-csv
          path: tulu_panchanga/build/csv/
