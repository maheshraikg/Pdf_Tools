name: Tulu Panchanga (Flutter)

on:
  push:
    branches: [ master, main ]
    paths: [ 'tulu_panchanga/**', '.github/workflows/tulu-panchanga.yml' ]
  pull_request:
    paths: [ 'tulu_panchanga/**', '.github/workflows/tulu-panchanga.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tulu_panchanga
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Export Mangaluru CSVs (current and next year)
        run: |
          Y=$(date +%Y)
          for y in $Y $((Y+1)); do
            dart run tool/export_csv.dart --year $y --place mangaluru --out build/csv
          done

      # Signs with a fixed key so each build installs as an update. Set the
      # repository secrets TULU_KEYSTORE_BASE64 (base64 of a .jks/.p12),
      # TULU_KEYSTORE_PASSWORD, TULU_KEY_ALIAS and TULU_KEY_PASSWORD; without
      # them the APK is signed with this runner's throwaway debug key.
      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.TULU_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.TULU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TULU_KEY_ALIAS }}
          KEY_PW: ${{ secrets.TULU_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No TULU_KEYSTORE_BASE64 secret: APK is debug-signed and will not install over an earlier build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/upload.keystore"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PW"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: APK size
        run: |
          ls -l build/app/outputs/flutter-apk/app-release.apk
          echo "APK: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1) ($(stat -c %s build/app/outputs/flutter-apk/app-release.apk) bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tulu-panchanga-release-apk
          path: tulu_panchanga/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload CSVs
        uses: actions/upload-artifact@v4
        with:
          name: tulu-panchanga-mangaluru-csv
          path: tulu_panchanga/build/csv/

      # Direct download link (no zip):
      # https://github.com/<owner>/<repo>/releases/download/tulu-panchanga-latest/tulu-panchanga.apk
      # A rolling pre-release, replaced on every master build or manual run;
      # marked not-latest so it never shadows the PDF app's releases.
      - name: Publish APK to the tulu-panchanga-latest release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/tulu-panchanga.apk
          gh release delete tulu-panchanga-latest --yes --cleanup-tag || true
          gh release create tulu-panchanga-latest build/tulu-panchanga.apk \
            --target "${{ github.sha }}" --prerelease --latest=false \
            --title "Tulu Panchanga (latest build)" \
            --notes "Release APK built from ${{ github.sha }} (build ${{ github.run_number }}). Direct link: https://github.com/${{ github.repository }}/releases/download/tulu-panchanga-latest/tulu-panchanga.apk"
