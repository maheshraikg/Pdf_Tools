name: PO Calculator (Flutter)

on:
  push:
    branches: [ master, main ]
    paths: [ 'po_sahayak/**', '.github/workflows/po-sahayak.yml' ]
  pull_request:
    paths: [ 'po_sahayak/**', '.github/workflows/po-sahayak.yml' ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: po_sahayak
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Check no INTERNET permission in the release APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then echo "::warning::aapt2 not found, skipping"; exit 0; fi
          PERMS=$("$AAPT" dump permissions "$APK")
          echo "$PERMS"
          if echo "$PERMS" | grep -q 'android.permission.INTERNET'; then
            echo "::error::Release APK requests INTERNET permission"; exit 1
          fi

      - name: APK size
        run: |
          ls -l build/app/outputs/flutter-apk/app-release.apk
          echo "APK: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1) ($(stat -c %s build/app/outputs/flutter-apk/app-release.apk) bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: po-sahayak-release-apk
          path: po_sahayak/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: po-sahayak-symbols
          path: po_sahayak/build/symbols/
