name: Sorting Sahayak (Flutter)

on:
  pull_request:
    paths:
      - 'sorting_sahayak/**'
      - '.github/workflows/sorting-sahayak.yml'
  push:
    branches: [master]
    paths:
      - 'sorting_sahayak/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sorting_sahayak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: APK sizes
        run: |
          ls -l build/app/outputs/flutter-apk/*.apk | awk '{printf "%s  %.1f MB\n", $9, $5/1048576}' | tee apk-sizes.txt
          echo '### APK sizes' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' apk-sizes.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Check release manifest has no INTERNET permission
        run: |
          MANIFEST=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Merged manifest: $MANIFEST"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "INTERNET permission found in release manifest" && exit 1
          fi

      # Plain .apk downloads (no zip): some phone file managers cut large
      # files short when unzipping, and the APK then will not install.
      - name: Name APKs for direct download
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk po-sorting-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk po-sorting-armv7.apk

      - uses: actions/upload-artifact@v7
        with:
          path: sorting_sahayak/po-sorting-arm64.apk
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: sorting_sahayak/po-sorting-armv7.apk
          archive: false

      - uses: actions/upload-artifact@v4
        with:
          name: sorting-sahayak-apks
          path: |
            sorting_sahayak/build/app/outputs/flutter-apk/*-release.apk
            sorting_sahayak/apk-sizes.txt
