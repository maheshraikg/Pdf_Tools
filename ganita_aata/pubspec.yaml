name: ganita_aata
description: "Ganita Aata – offline maths practice game for children of Classes 1–8 (Kannada/English)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  hive_ce: ^2.23.2
  hive_ce_flutter: ^2.5.0
  just_audio: ^0.10.6
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  fl_chart: ^1.3.0
  crypto: ^3.0.8
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-BalooTamma2.txt
    - assets/fonts/OFL-Baloo2.txt
    - assets/images/
    - assets/game/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/audio/en/
    - assets/audio/en/tables/
    - assets/audio/kn/
    - assets/audio/kn/tables/
    - assets/audio/hi/
    - assets/audio/hi/tables/
    - assets/audio/mr/
    - assets/audio/mr/tables/
    - assets/audio/ta/
    - assets/audio/ta/tables/
    - assets/audio/te/
    - assets/audio/te/tables/
    - assets/audio/ml/
    - assets/audio/ml/tables/
    - assets/audio/bn/
    - assets/audio/bn/tables/
    - assets/audio/gu/
    - assets/audio/gu/tables/
    - assets/audio/pa/
    - assets/audio/pa/tables/
    - assets/audio/or/
    - assets/audio/or/tables/
    - assets/audio/ur/
    - assets/audio/ur/tables/

  fonts:
    # Baloo Tamma 2 (SIL OFL 1.1) – rounded, playful; Kannada + Latin.
    # Used for titles, buttons and numbers.
    - family: Baloo
      fonts:
        - asset: assets/fonts/BalooTamma2-500.ttf
          weight: 500
        - asset: assets/fonts/BalooTamma2-700.ttf
          weight: 700
        - asset: assets/fonts/BalooTamma2-800.ttf
          weight: 800
    # Baloo 2 family for the other Indian scripts and Urdu (SIL OFL 1.1), one
    # weight each, subset to their script. Fallbacks of Baloo.
    - family: BalooDeva
      fonts:
        - asset: assets/fonts/BalooDeva-700.ttf
          weight: 700
    - family: BalooTamil
      fonts:
        - asset: assets/fonts/BalooTamil-700.ttf
          weight: 700
    - family: BalooTelugu
      fonts:
        - asset: assets/fonts/BalooTelugu-700.ttf
          weight: 700
    - family: BalooMalayalam
      fonts:
        - asset: assets/fonts/BalooMalayalam-700.ttf
          weight: 700
    - family: BalooBengali
      fonts:
        - asset: assets/fonts/BalooBengali-700.ttf
          weight: 700
    - family: BalooGujarati
      fonts:
        - asset: assets/fonts/BalooGujarati-700.ttf
          weight: 700
    - family: BalooGurmukhi
      fonts:
        - asset: assets/fonts/BalooGurmukhi-700.ttf
          weight: 700
    - family: BalooOdia
      fonts:
        - asset: assets/fonts/BalooOdia-700.ttf
          weight: 700
    - family: BalooArabic
      fonts:
        - asset: assets/fonts/BalooArabic-700.ttf
          weight: 700
    # Noto Sans Kannada (SIL OFL 1.1) – body text.
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada-Regular.ttf
        - asset: assets/fonts/NotoSansKannada-Bold.ttf
          weight: 700
