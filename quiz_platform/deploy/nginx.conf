# Reverse proxy / load balancer in front of the app instances.
# Terminate TLS here (or at your cloud load balancer) and set COOKIE_SECURE=true.
worker_processes auto;
events { worker_connections 20000; }
worker_rlimit_nofile 50000;

http {
  include /etc/nginx/mime.types;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's DNS returns every replica of "app"; nginx balances across them.
  resolver 127.0.0.11 valid=10s;
  upstream quiz_app {
    least_conn;
    server app:3000 max_fails=3 fail_timeout=5s;
    keepalive 256;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  server {
    listen 80;
    # listen 443 ssl http2;  ssl_certificate ...; ssl_certificate_key ...;

    location /api/ws {
      proxy_pass http://quiz_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://quiz_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Answers must never be retried on another upstream automatically:
      # the client retries with the same idempotency key instead.
      proxy_next_upstream off;
    }

    location = /metrics { deny all; }
  }
}
